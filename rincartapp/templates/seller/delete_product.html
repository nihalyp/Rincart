
{% extends 'seller/seller_base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Delete Product</h4>
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete <strong>"{{ product.name }}"</strong>?</p>
            <p class="text-muted small">This action cannot be undone and will permanently remove this product and all associated images.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'seller_dashboard' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
