{% extends 'base.html' %}
{% block title %} Welcome to RinCart — Set Up Your Profile {% endblock %}

{% block content %}

<!-- 🔤 Google Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    :root {
        --brand-indigo: #4f46e5;
        --brand-purple: #764ba2;
        --brand-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --card-bg: #ffffff;
        --sub-card-bg: #f8fafc;
        --input-bg: #ffffff;
        --border-subtle: rgba(226, 232, 240, 0.8);
        --text-main: #0f172a;
        --text-sub: #64748b;
        --transition-base: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-bs-theme="dark"] {
        --card-bg: #0f172a;
        --sub-card-bg: rgba(255, 255, 255, 0.03);
        --input-bg: #1e293b;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: var(--text-main);
    }

    h1, h2, h3, h4, h5, h6 {
        font-family: 'Outfit', sans-serif;
    }

    /* 📱 Outer Wrapper Container */
    .onboarding-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }

    /* 📦 Onboarding Glass Card */
    .onboarding-card {
        background: var(--card-bg);
        border: 1px solid var(--border-subtle);
        border-radius: 28px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        transition: var(--transition-base);
        max-width: 480px;
        width: 100%;
    }

    /* 🌟 Animated Welcome Icon Box */
    .welcome-icon-box {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: rgba(79, 70, 229, 0.1);
        color: var(--brand-indigo);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        font-size: 1.8rem;
        box-shadow: inset 0 0 0 1px rgba(79, 70, 229, 0.2);
        animation: pulse-glow 3s infinite ease-in-out;
    }

    @keyframes pulse-glow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.2); }
        50% { transform: scale(1.04); box-shadow: 0 0 20px 0 rgba(79, 70, 229, 0.3); }
    }

    /* ✏️ Custom Form Field */
    .custom-input-group {
        position: relative;
        background: var(--input-bg);
        border: 1.5px solid var(--border-subtle);
        border-radius: 14px;
        transition: var(--transition-base);
        display: flex;
        align-items: center;
        padding: 4px 14px;
    }

    .custom-input-group:focus-within {
        border-color: var(--brand-indigo);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .custom-input-group .form-control {
        background: transparent;
        border: none;
        box-shadow: none;
        color: var(--text-main);
        font-size: 1rem;
        font-weight: 600;
        padding: 12px 10px;
    }

    .custom-input-group .form-control::placeholder {
        color: var(--text-sub);
        font-weight: 400;
        opacity: 0.7;
    }

    /* 🚀 CTA Button */
    .btn-submit-brand {
        background: var(--brand-gradient);
        color: #ffffff;
        border: none;
        border-radius: 14px;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 1rem;
        transition: var(--transition-base);
        box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.4);
    }

    .btn-submit-brand:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 25px -5px rgba(102, 126, 234, 0.5);
        color: #ffffff;
    }

    .btn-submit-brand:active {
        transform: translateY(0);
    }
</style>

<div class="onboarding-wrapper">
    <div class="onboarding-card p-4 p-md-5">
        
        <!-- Header & Icon -->
        <div class="text-center mb-4">
            <div class="welcome-icon-box mb-3">
                <i class="bi bi-person-fill-add"></i>
            </div>
            <h2 class="fw-extrabold text-body mb-2">Welcome to RinCart!</h2>
            <p class="text-secondary small mb-0 lh-base">
                Let’s personalize your experience. Tell us what we should call you!
            </p>
        </div>

        <!-- Onboarding Form -->
        <form method="POST" class="text-start">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="first_name" class="form-label fw-bold text-body small mb-2 d-flex align-items-center gap-1.5">
                    <i class="bi bi-person-badge text-primary"></i> What is your name?
                </label>
                
                <div class="custom-input-group">
                    <i class="bi bi-person text-secondary fs-5 ms-1"></i>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        class="form-control" 
                        placeholder="e.g. Alex Morgan" 
                        value="{{ user.first_name }}" 
                        required
                        autocomplete="off"
                        autofocus
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-submit-brand w-100 d-flex align-items-center justify-content-center gap-2">
                <span>Continue to Dashboard</span>
                <i class="bi bi-arrow-right fs-5"></i>
            </button>
        </form>

        <!-- Feature List -->
        <div class="mt-4 pt-3 border-top border-opacity-10 d-flex justify-content-around text-center">
            <div class="small text-secondary">
                <i class="bi bi-shield-check text-success me-1"></i> Secure Profile
            </div>
            <div class="small text-secondary">
                <i class="bi bi-lightning-charge text-warning me-1"></i> Fast Checkout
            </div>
        </div>

    </div>
</div>

{% endblock %}
