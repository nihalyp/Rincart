<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Seller — RinCart</title>

    <!-- 🔤 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🎨 Bootstrap 5.3.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #ffb703;
            --brand-orange: #fb8500;
            --brand-gradient: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            --brand-glow: rgba(255, 183, 3, 0.25);
            
            --bg-light: #f8fafc;
            --bg-dark: #030712;
            
            --card-light: #ffffff;
            --card-dark: #0f172a;
            
            --border-light: rgba(226, 232, 240, 0.8);
            --border-dark: rgba(255, 255, 255, 0.08);

            --transition-smooth: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: #0f172a;
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
        }

        [data-bs-theme="dark"] body {
            background-color: var(--bg-dark) !important;
            color: #f8fafc !important;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
        }

        /* 🔝 Glass Header Nav */
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition-smooth);
        }

        [data-bs-theme="dark"] .glass-header {
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid var(--border-dark);
        }

        /* 🏪 Main Seller Form Card */
        .seller-card {
            border: 1px solid var(--border-light);
            border-radius: 28px;
            background: var(--card-light);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
            transition: var(--transition-smooth);
            overflow: hidden;
        }

        [data-bs-theme="dark"] .seller-card {
            background: var(--card-dark);
            border-color: var(--border-dark);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .seller-card:hover {
            box-shadow: 0 30px 60px -15px var(--brand-glow);
            border-color: var(--brand-gold);
        }

        /* Accent Gradient Top Line */
        .card-accent-bar {
            height: 6px;
            width: 100%;
            background: var(--brand-gradient);
        }

        /* 🛍️ Floating Icon Badge */
        .store-icon-badge {
            width: 84px;
            height: 84px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: rgba(255, 183, 3, 0.12);
            color: var(--brand-orange);
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 10px 20px -5px var(--brand-glow);
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ✍️ Form Control Styling */
        .form-control {
            border-radius: 14px;
            padding: 0.8rem 1.1rem;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
            border: 1.5px solid var(--border-light);
        }

        [data-bs-theme="dark"] .form-control {
            background-color: rgba(30, 41, 59, 0.5);
            border-color: var(--border-dark);
            color: #f8fafc;
        }

        .form-control:focus {
            border-color: var(--brand-gold);
            box-shadow: 0 0 0 0.25rem var(--brand-glow);
        }

        /* 🚀 Action Buttons */
        .btn-brand {
            background: var(--brand-gradient);
            color: #ffffff;
            border: none;
            font-weight: 700;
            padding: 0.85rem;
            font-size: 1.05rem;
            transition: var(--transition-smooth);
            border-radius: 16px;
        }

        .btn-brand:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px var(--brand-glow);
            color: #ffffff;
        }

        /* Feature Micro Badges */
        .perk-box {
            border-radius: 16px;
            background: rgba(248, 250, 252, 0.8);
            border: 1px solid var(--border-light);
            transition: var(--transition-smooth);
        }

        [data-bs-theme="dark"] .perk-box {
            background: rgba(30, 41, 59, 0.4);
            border-color: var(--border-dark);
        }

        .btn-theme-toggle {
            transition: var(--transition-smooth);
            border-radius: 99px;
        }

        .btn-theme-toggle:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="d-flex flex-column">

    <!-- 🔝 Top Glass Navigation Bar -->
    <nav class="navbar sticky-top glass-header py-3 mb-4">
        <div class="container" style="max-width: 900px;">
            <a href="{% url 'home' %}" class="btn btn-link link-body-emphasis text-decoration-none fw-bold d-flex align-items-center gap-2 px-0">
                <i class="bi bi-arrow-left-short fs-4 text-warning"></i>
                <span>Back to Store</span>
            </a>
            
            <button id="darkModeToggle" class="btn btn-theme-toggle btn-light border px-3 py-1.5 d-flex align-items-center gap-2 shadow-sm">
                <i id="darkModeIcon" class="bi bi-moon-stars-fill text-warning"></i>
            </button>
        </div>
    </nav>

    <!-- 📦 Main Seller Application Form -->
    <div class="container my-auto py-4" style="max-width: 620px;">
        
        <div class="card seller-card">
            <div class="card-accent-bar"></div>
            
            <div class="card-body p-4 p-md-5">
                
                <!-- Hero Header -->
                <div class="text-center mb-4">
                    <div class="store-icon-badge mb-3">
                        <i class="bi bi-shop fs-1"></i>
                    </div>
                    <h2 class="fw-extrabold mb-2">Start Selling on <span class="text-warning">RinCart</span></h2>
                    <p class="text-secondary small mb-0 lh-base">
                        Join our merchant network and take your business online to connect with thousands of active buyers.
                    </p>
                </div>

                <!-- Seller Form -->
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3.5 mb-md-4">
                        <label class="form-label fw-bold small text-secondary d-flex align-items-center gap-1">
                            <i class="bi bi-bag-check-fill text-warning"></i> Shop Name
                        </label>
                        <input type="text" name="shop_name" class="form-control" placeholder="e.g., Rin Fashion Hub" required>
                    </div>

                    <div class="mb-3.5 mb-md-4">
                        <label class="form-label fw-bold small text-secondary d-flex align-items-center gap-1">
                            <i class="bi bi-telephone-fill text-warning"></i> Phone Number
                        </label>
                        <input type="tel" name="phone_number" class="form-control" placeholder="e.g., +91 9876543210" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary d-flex align-items-center justify-content-between">
                            <span class="d-flex align-items-center gap-1">
                                <i class="bi bi-receipt-cutoff text-warning"></i> GST Number
                            </span>
                            <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-10 rounded-pill px-2.5 py-1">Optional</span>
                        </label>
                        <input type="text" name="gst_number" class="form-control" placeholder="15-digit GSTIN number">
                    </div>

                    <button type="submit" class="btn btn-brand w-100 shadow-sm d-flex align-items-center justify-content-center gap-2 mt-2">
                        <span>Submit Application</span>
                        <i class="bi bi-arrow-right-circle-fill"></i>
                    </button>
                </form>

                <!-- Value Proposition Trust Badges -->
                <div class="row g-2 mt-4 pt-3 border-top border-secondary border-opacity-10 text-center">
                    <div class="col-4">
                        <div class="perk-box p-2">
                            <i class="bi bi-lightning-charge-fill text-warning fs-5"></i>
                            <p class="small fw-bold mb-0 mt-1" style="font-size: 0.72rem;">0% Fee Setup</p>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="perk-box p-2">
                            <i class="bi bi-globe2 text-info fs-5"></i>
                            <p class="small fw-bold mb-0 mt-1" style="font-size: 0.72rem;">Pan-India Reach</p>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="perk-box p-2">
                            <i class="bi bi-shield-check text-success fs-5"></i>
                            <p class="small fw-bold mb-0 mt-1" style="font-size: 0.72rem;">Secure Payouts</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Universal Footer -->
        <p class="text-center text-muted small mt-4 mb-2">&copy; 2026 RinCart Merchant Lab. All seller rights reserved.</p>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 💡 Dark Theme Controller Engine -->
    <script>
        const toggleBtn = document.getElementById('darkModeToggle');
        const themeIcon = document.getElementById('darkModeIcon');
        const htmlElement = document.documentElement;

        // Load & Sync Theme State
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        updateButton(savedTheme);

        toggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateButton(newTheme);
        });

        function updateButton(theme) {
            if (theme === 'dark') {
                themeIcon.className = 'bi bi-sun-fill text-warning';
                toggleBtn.classList.replace('btn-light', 'btn-dark');
            } else {
                themeIcon.className = 'bi bi-moon-stars-fill text-warning';
                toggleBtn.classList.replace('btn-dark', 'btn-light');
            }
        }
    </script>
</body>
</html>
